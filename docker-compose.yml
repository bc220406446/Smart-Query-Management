services:
  db:
    image: postgres:16-alpine
    container_name: smartquery-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smartquery
    ports:
      - "5432:5432"
    volumes:
      - smartquery-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartquery"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  smartquery-data: